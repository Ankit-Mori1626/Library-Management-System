sonar.projectKey=library-management-system
sonar.projectName=Library Management System

# Code to analyse
sonar.sources=client/src,server/server.js,server/models.js
sonar.exclusions=client/src/__tests__/**,client/src/setupTests.js,**/node_modules/**

# Test files (Sonar shows them separately, not as "code smells")
sonar.tests=client/src/__tests__,server/tests
sonar.test.inclusions=**/*.test.js,**/*.test.jsx

# Coverage reports created by "npm run test:ci"
sonar.javascript.lcov.reportPaths=client/coverage/lcov.info,server/coverage/lcov.info

sonar.sourceEncoding=UTF-8
