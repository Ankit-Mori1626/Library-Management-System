services:
  frontend:
    image: ankitmori1626/library-frontend:${TAG}
    container_name : librarymanagementfrontend
    ports : 
     - "5173:5173"
    networks : 
     - library

  backend:
    image : ankitmori1626/library-backend:${TAG}
    container_name : librarymanagementbackend
    ports :
     - "5000:5000"
    env_file :
      - ./server/.env
    networks :
     - library

  mongo:
   image: mongo:latest
   container_name : librarymongo
   ports :
    - "27017:27017"
   networks :
    - library
  
networks :
  library :
   driver : bridge


volumes:
  mongo_data:
